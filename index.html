<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento do voto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
      font-size: 15px;
    }

    .choice-box {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .choice-label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .choice {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
    }

    .price-label {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 10px;
    }

    .price {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 4px 0 20px;
      color: #111;
    }

    .status {
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 14px;
    }

    .status.success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .status.loading {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    .status-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .id-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-top: 15px;
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }

    .pix-box {
      margin-top: 20px;
      text-align: center;
    }

    .pix-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .pix-code {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      background: #f9fafb;
    }

    .copy-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-button:hover {
      background: #000;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 18px;
    }

    .hidden {
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(29, 78, 216, 0.25);
      border-top-color: #1d4ed8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">📦</div>

      <h1>Finalize seu voto</h1>

      <div class="subtitle">
        Faça o pagamento de <strong>R$ 5,00</strong> via PIX
        para confirmar sua participação.
      </div>

      <!-- ESCOLHA -->
      <div class="choice-box">
        <div class="choice-label">
          Sua escolha
        </div>

        <div class="choice" id="choice">
          Carregando...
        </div>
      </div>

      <!-- VALOR -->
      <div class="price-label">
        Valor para confirmar o voto
      </div>

      <div class="price">
        R$ 5,00
      </div>

      <!-- STATUS -->
      <div id="status" class="status loading">
        <div class="status-title">
          <span class="spinner"></span>
          Processando...
        </div>

        <div id="statusMessage">
          Identificando sua escolha.
        </div>
      </div>

      <!-- IDENTIFICADOR -->
      <div class="id-box">
        <strong>payment_option_id:</strong>
        <div id="paymentOptionId">
          -
        </div>
      </div>

      <!-- PIX -->
      <div id="pixBox" class="pix-box hidden">

        <div class="pix-title">
          PIX para pagamento
        </div>

        <textarea
          id="pixCode"
          class="pix-code"
          readonly
          placeholder="O código PIX aparecerá aqui."
        ></textarea>

        <button
          id="copyButton"
          class="copy-button"
          type="button"
          onclick="copiarPix()"
        >
          Copiar código PIX
        </button>

      </div>

    </div>

    <div class="footer">
      Pagamento processado via PIX.
    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * CONFIGURAÇÃO
     * ==========================================================
     *
     * NÃO coloque a chave secreta da Asaas neste arquivo.
     *
     * Se você já possui uma API/Edge Function responsável por
     * criar o pagamento, coloque a URL dela aqui.
     *
     * Exemplo:
     *
     * const PAYMENT_API_URL =
     *   "https://SEU-PROJETO.supabase.co/functions/v1/criar-pagamento";
     *
     */

    const PAYMENT_API_URL = "";


    /*
     * ==========================================================
     * IDENTIFICADORES DAS OPÇÕES
     * ==========================================================
     *
     * Estes identificadores vêm do Tally através de:
     *
     * ?payment_option_id=@payment_option_id
     *
     */

    const OPTIONS = {

      lula: {
        id: "9823e037-4045-40dd-8b5f-a183ea4cdc44",
        name: "LULA"
      },

      flavio: {
        /*
         * O início do ID aparece no seu Tally.
         * O restante pode ser completado automaticamente
         * porque usamos startsWith().
         */
        prefix: "1b457898-2a19-4342-a5f6-2a867b07",
        name: "FLÁVIO BOLSONARO"
      },

      renan: {
        prefix: "4debd19b-bf23-4a04-ae44-daa9c05f",
        name: "RENAN SANTOS"
      }

    };


    /*
     * ==========================================================
     * LER PARÂMETROS DA URL
     * ==========================================================
     */

    const params = new URLSearchParams(window.location.search);

    const paymentOptionId =
      params.get("payment_option_id") ||
      params.get("paymentOptionId") ||
      params.get("option_id") ||
      "";


    /*
     * Também aceitamos "choice" caso posteriormente
     * você queira enviar diretamente o nome pelo Tally.
     *
     * Exemplo:
     *
     * ?payment_option_id=...&choice=LULA
     */

    const directChoice =
      params.get("choice") ||
      params.get("vote") ||
      params.get("escolha") ||
      "";


    /*
     * ==========================================================
     * ELEMENTOS
     * ==========================================================
     */

    const choiceElement =
      document.getElementById("choice");

    const statusElement =
      document.getElementById("status");

    const statusMessageElement =
      document.getElementById("statusMessage");

    const paymentOptionIdElement =
      document.getElementById("paymentOptionId");

    const pixBox =
      document.getElementById("pixBox");

    const pixCode =
      document.getElementById("pixCode");


    /*
     * ==========================================================
     * DESCOBRIR A ESCOLHA
     * ==========================================================
     */

    function getChoice(id) {

      /*
       * Se o Tally futuramente enviar diretamente o nome,
       * damos preferência a ele.
       */

      if (directChoice) {

        return decodeURIComponent(directChoice)
          .trim()
          .toUpperCase();

      }


      /*
       * LULA
       */

      if (id === OPTIONS.lula.id) {

        return OPTIONS.lula.name;

      }


      /*
       * FLÁVIO BOLSONARO
       */

      if (
        OPTIONS.flavio.prefix &&
        id.startsWith(OPTIONS.flavio.prefix)
      ) {

        return OPTIONS.flavio.name;

      }


      /*
       * RENAN SANTOS
       */

      if (
        OPTIONS.renan.prefix &&
        id.startsWith(OPTIONS.renan.prefix)
      ) {

        return OPTIONS.renan.name;

      }


      return null;
    }


    /*
     * ==========================================================
     * ATUALIZAR INTERFACE
     * ==========================================================
     */

    function showError(message) {

      statusElement.className =
        "status error";

      statusElement.innerHTML = `
        <div class="status-title">
          Não foi possível continuar.
        </div>

        <div>
          ${message}
        </div>
      `;
    }


    function showSuccess(message) {

      statusElement.className =
        "status success";

      statusElement.innerHTML = `
        <div class="status-title">
          Escolha recebida corretamente!
        </div>

        <div>
          ${message}
        </div>
      `;
    }


    function showLoading(message) {

      statusElement.className =
        "status loading";

      statusElement.innerHTML = `
        <div class="status-title">
          <span class="spinner"></span>
          Processando...
        </div>

        <div>
          ${message}
        </div>
      `;
    }


    /*
     * ==========================================================
     * INICIALIZAÇÃO
     * ==========================================================
     */

    async function iniciar() {

      /*
       * Nenhuma opção enviada.
       */

      if (!paymentOptionId && !directChoice) {

        choiceElement.textContent =
          "Nenhuma escolha";

        showError(
          "Nenhuma opção de voto foi informada. " +
          "Volte ao formulário e selecione uma opção."
        );

        return;
      }


      /*
       * Exibir ID recebido.
       */

      paymentOptionIdElement.textContent =
        paymentOptionId || "(enviado diretamente)";


      /*
       * Descobrir nome.
       */

      const choice =
        getChoice(paymentOptionId);


      /*
       * Se conseguimos identificar.
       */

      if (choice) {

        choiceElement.textContent =
          choice;

        showSuccess(
          "O sistema recebeu o identificador da sua escolha. " +
          "A próxima etapa será gerar o PIX."
        );

      }

      /*
       * Caso não reconheça o UUID.
       */

      else {

        choiceElement.textContent =
          "Opção selecionada";

        showError(
          "O identificador da escolha foi recebido, " +
          "mas ainda não está associado a uma opção conhecida."
        );

        return;
      }


      /*
       * ========================================================
       * GERAÇÃO DO PAGAMENTO
       * ========================================================
       *
       * Só executa se PAYMENT_API_URL estiver configurada.
       */

      if (!PAYMENT_API_URL) {

        return;
      }


      try {

        showLoading(
          "Gerando seu pagamento PIX..."
        );


        const response =
          await fetch(PAYMENT_API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              payment_option_id:
                paymentOptionId,

              choice:
                choice,

              amount:
                5.00

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data?.error ||
            data?.message ||
            "Erro ao gerar o pagamento."
          );

        }


        /*
         * Procuramos alguns nomes comuns de retorno
         * para facilitar a integração com a função.
         */

        const pix =
          data.pixCopyPaste ||
          data.pix_copy_paste ||
          data.pixCode ||
          data.pix_code ||
          data.qrCode ||
          data.qr_code ||
          data.payment?.pixCopyPaste ||
          data.payment?.pix_copy_paste ||
          "";


        if (pix) {

          pixCode.value = pix;

          pixBox.classList.remove("hidden");

          showSuccess(
            "Pagamento PIX gerado. " +
            "Copie o código abaixo e efetue o pagamento."
          );

        }

        else {

          showSuccess(
            "Pagamento criado com sucesso. " +
            "Aguarde as instruções de pagamento."
          );

        }


      }

      catch (error) {

        console.error(
          "Erro ao gerar pagamento:",
          error
        );

        showError(
          error.message ||
          "Não foi possível gerar o pagamento PIX."
        );

      }

    }


    /*
     * ==========================================================
     * COPIAR PIX
     * ==========================================================
     */

    async function copiarPix() {

      const code =
        pixCode.value.trim();


      if (!code) {

        return;

      }


      try {

        await navigator.clipboard.writeText(code);

        const button =
          document.getElementById("copyButton");

        const original =
          button.textContent;

        button.textContent =
          "✓ PIX copiado!";

        setTimeout(() => {

          button.textContent =
            original;

        }, 2000);

      }

      catch (error) {

        pixCode.select();

        document.execCommand("copy");

      }

    }


    /*
     * ==========================================================
     * EXECUTAR
     * ==========================================================
     */

    iniciar();

  </script>

</body>
</html>
